services:
  - type: web
    name: aegis-finance-brain
    plan: free
    runtime: node
    rootDir: apps/finance-brain/server
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: PORT
        value: "10000"
      - key: AEGIS_AI_PROVIDER
        value: mock
      - key: PAPER_MODEL_FALLBACK
        value: "true"
      - key: PAPER_EXECUTE_WATCH
        value: "true"
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: MUAPI_API_KEY
        sync: false

  - type: web
    name: aegis-commerce-brain
    plan: free
    runtime: node
    rootDir: apps/commerce-brain
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: PORT
        value: "10000"
      - key: MEDIA_BRAIN_URL
        value: https://aegis-media-brain.onrender.com
      - key: MANAGER_BRAIN_URL
        value: https://aegis-manager-brain.onrender.com
      - key: APIFY_API_TOKEN
        sync: false
      - key: APIFY_AMAZON_ACTOR_ID
        sync: false
      - key: AMAZON_CREATORS_CLIENT_ID
        sync: false
      - key: AMAZON_CREATORS_CLIENT_SECRET
        sync: false
      - key: AMAZON_PARTNER_TAG
        sync: false
      - key: SHOPIFY_ADMIN_ACCESS_TOKEN
        sync: false
      - key: SHOPIFY_STORE_DOMAIN
        sync: false

  - type: web
    name: aegis-saas-brain
    plan: free
    runtime: node
    rootDir: apps/saas-brain
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: PORT
        value: "10000"
      - key: STRIPE_SECRET_KEY
        sync: false

  - type: web
    name: aegis-media-brain
    plan: free
    runtime: node
    rootDir: apps/media-brain
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: PORT
        value: "10000"
      - key: COMMERCE_BRAIN_URL
        value: https://aegis-commerce-brain.onrender.com
      - key: SAAS_BRAIN_URL
        value: https://aegis-saas-brain.onrender.com
      - key: MUAPI_API_KEY
        sync: false
      - key: MUAPI_BASE_URL
        value: https://api.muapi.ai

  - type: web
    name: aegis-services-brain
    plan: free
    runtime: node
    rootDir: apps/services-brain
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: PORT
        value: "10000"
      - key: SERVICES_MODE
        value: PAPER
      - key: SERVICES_AUTOMATION_ENABLED
        value: "false"
      - key: SERVICES_REQUIRE_APPROVAL
        value: "true"
      - key: SERVICES_ALLOWED_ORIGINS
        value: "*"
      - key: FINANCE_BRAIN_URL
        value: https://aegis-finance-brain.onrender.com
      - key: COMMERCE_BRAIN_URL
        value: https://aegis-commerce-brain.onrender.com
      - key: SAAS_BRAIN_URL
        value: https://aegis-saas-brain.onrender.com
      - key: MEDIA_BRAIN_URL
        value: https://aegis-media-brain.onrender.com
      - key: MANAGER_BRAIN_URL
        value: https://aegis-manager-brain.onrender.com
      - key: CEO_BRAIN_URL
        value: https://aegis-ceo-brain.onrender.com
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_DOMAIN
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: RESEND_REPLY_TO_EMAIL
        sync: false
      - key: MUAPI_API_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false

  - type: web
    name: aegis-manager-brain
    plan: free
    runtime: node
    rootDir: apps/manager-brain
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: PORT
        value: "10000"
      - key: FINANCE_BRAIN_URL
        value: https://aegis-finance-brain.onrender.com
      - key: COMMERCE_BRAIN_URL
        value: https://aegis-commerce-brain.onrender.com
      - key: SAAS_BRAIN_URL
        value: https://aegis-saas-brain.onrender.com
      - key: MEDIA_BRAIN_URL
        value: https://aegis-media-brain.onrender.com
      - key: SERVICES_BRAIN_URL
        value: https://aegis-services-brain.onrender.com
      - key: OPENAI_API_KEY
        sync: false
      - key: AEGIS_AI_PROVIDER
        value: mock

  - type: web
    name: aegis-ceo-brain
    plan: free
    runtime: node
    rootDir: apps/ceo-brain
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: PORT
        value: "10000"
      - key: MANAGER_BRAIN_URL
        value: https://aegis-manager-brain.onrender.com
      - key: FINANCE_BRAIN_URL
        value: https://aegis-finance-brain.onrender.com
      - key: COMMERCE_BRAIN_URL
        value: https://aegis-commerce-brain.onrender.com
      - key: SAAS_BRAIN_URL
        value: https://aegis-saas-brain.onrender.com
      - key: MEDIA_BRAIN_URL
        value: https://aegis-media-brain.onrender.com
      - key: SERVICES_BRAIN_URL
        value: https://aegis-services-brain.onrender.com
      - key: OPENAI_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
